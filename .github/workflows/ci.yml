name: Noti-Fixer CI & Validation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-scripts:
    name: Validate Python Engine & Scripts (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu Runners with Supported Python Binaries
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          # Windows Runners
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Scripts & Check Syntax
        run: |
          python -m py_compile scripts/detect_device.py
          python -m py_compile scripts/audit_fcm_doze.py
          python -m py_compile scripts/apply_notification_fix.py
          python -m py_compile scripts/scan_ports.py
          python -m py_compile scripts/connect_phone.py
          python -m py_compile scripts/inspect_battery.py
          python -m py_compile scripts/restore_background_health.py
          python -m py_compile scripts/restore_backup.py
          python -m py_compile scripts/debloat_manager.py
          python -m py_compile scripts/adblock_manager.py
          python -m py_compile scripts/safety_guard.py

      - name: Run Non-Destructive Safety Guard Verification Tests
        run: |
          python scripts/safety_guard.py

      - name: Verify CLI Help Flags
        run: |
          python scripts/detect_device.py --help
          python scripts/audit_fcm_doze.py --help
          python scripts/apply_notification_fix.py --help
          python scripts/scan_ports.py --help
          python scripts/restore_backup.py --help
          python scripts/debloat_manager.py --help
          python scripts/adblock_manager.py --help
          python scripts/inspect_battery.py --help
          python scripts/restore_background_health.py --help

  validate-shell:
    name: Validate Shell & Daemon Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Shell Scripts with ShellCheck
        run: |
          bash -n scripts/millet_watchdog.sh
          bash -n scripts/NotiFixer_OneClick.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -e SC2086,SC2181,SC2046 scripts/millet_watchdog.sh
            shellcheck -e SC2086,SC2181,SC2046 scripts/NotiFixer_OneClick.sh
          fi
