name: Noti-Fixer CI & Validation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-scripts:
    name: Validate Python Engine & Scripts (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Scripts & Check Syntax
        run: |
          python -m py_compile scripts/detect_device.py
          python -m py_compile scripts/audit_fcm_doze.py
          python -m py_compile scripts/apply_notification_fix.py
          python -m py_compile scripts/scan_ports.py
          python -m py_compile scripts/connect_phone.py

      - name: Verify CLI Help Flags
        run: |
          python scripts/detect_device.py --help
          python scripts/audit_fcm_doze.py --help
          python scripts/apply_notification_fix.py --help
          python scripts/scan_ports.py --help

  validate-shell:
    name: Validate Shell & Daemon Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Shell Scripts with ShellCheck
        run: |
          bash -n scripts/millet_watchdog.sh
          bash -n scripts/NotiFixer_OneClick.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -e SC2086,SC2181,SC2046 scripts/millet_watchdog.sh
            shellcheck -e SC2086,SC2181,SC2046 scripts/NotiFixer_OneClick.sh
          fi

