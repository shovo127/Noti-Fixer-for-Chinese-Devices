<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto" style="background:#0d1117;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background glow -->
  <rect x="10" y="10" width="880" height="220" rx="10" fill="url(#glowGrad)" stroke="#30363d" stroke-width="1" />

  <!-- Animated Pulse Dot -->
  <circle cx="50" cy="52" r="8" fill="#22c55e">
    <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="50" cy="52" r="14" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Title -->
  <text x="75" y="60" fill="url(#titleGrad)" font-size="34" font-weight="800" letter-spacing="-0.5">⚡ Noti-Fixer for Chinese Devices</text>
  
  <!-- Subtitle -->
  <text x="50" y="102" fill="#94a3b8" font-size="16" font-weight="500">Autonomous Push Notification Healer &amp; Reversible App Optimizer for Chinese Android ROMs</text>

  <!-- Brand Chips -->
  <g transform="translate(50, 132)">
    <!-- Xiaomi HyperOS -->
    <rect x="0" y="0" width="148" height="34" rx="17" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
    <circle cx="16" cy="17" r="5" fill="#f97316" />
    <text x="30" y="22" fill="#f8fafc" font-size="13" font-weight="600">Xiaomi HyperOS</text>

    <!-- Vivo OriginOS -->
    <rect x="158" y="0" width="138" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="174" cy="17" r="5" fill="#3b82f6" />
    <text x="188" y="22" fill="#f8fafc" font-size="13" font-weight="600">Vivo OriginOS</text>

    <!-- Oppo ColorOS -->
    <rect x="306" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="322" cy="17" r="5" fill="#10b981" />
    <text x="336" y="22" fill="#f8fafc" font-size="13" font-weight="600">Oppo ColorOS</text>

    <!-- Huawei HarmonyOS -->
    <rect x="456" y="0" width="168" height="34" rx="17" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="472" cy="17" r="5" fill="#ef4444" />
    <text x="486" y="22" fill="#f8fafc" font-size="13" font-weight="600">Huawei HarmonyOS</text>

    <!-- Meizu Flyme -->
    <rect x="634" y="0" width="128" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="650" cy="17" r="5" fill="#06b6d4" />
    <text x="664" y="22" fill="#f8fafc" font-size="13" font-weight="600">Meizu Flyme</text>
  </g>

  <!-- Tagline bar -->
  <g transform="translate(50, 185)">
    <text x="0" y="20" fill="#64748b" font-size="13" font-weight="500">🔒 Zero Root Required  •  🛡️ 100% Reversible  •  🚫 Zero Phone Reset  •  🔋 Smart On-Demand Standby</text>
  </g>
</svg>
