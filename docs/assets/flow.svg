<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="auto" style="background:#0d1117;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="35" y="36" fill="#f8fafc" font-size="18" font-weight="700">Autonomous 5-Step Safety Pipeline</text>
  <text x="35" y="56" fill="#94a3b8" font-size="12">Deterministic, fully audited execution with mandatory user review before any modification</text>

  <!-- Pipeline Connector line -->
  <line x1="100" y1="130" x2="800" y2="130" stroke="#334155" stroke-width="3" stroke-dasharray="6 4" />

  <!-- Animated flow pulse traveling across the pipeline -->
  <circle r="6" fill="#38bdf8">
    <animateMotion path="M 100 130 L 800 130" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;1;1;0.2" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Step 1: Connect -->
  <g transform="translate(35, 75)">
    <rect width="135" height="110" rx="8" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="28" cy="28" r="14" fill="#0284c7" />
    <text x="24" y="33" fill="#fff" font-size="13" font-weight="700">1</text>
    <text x="50" y="32" fill="#38bdf8" font-size="14" font-weight="700">Connect</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="11" font-weight="600">Wireless ADB</text>
    <text x="14" y="78" fill="#64748b" font-size="10">Pair port + code</text>
    <text x="14" y="94" fill="#22c55e" font-size="10">● No cable needed</text>
  </g>

  <!-- Step 2: Scan -->
  <g transform="translate(205, 75)">
    <rect width="135" height="110" rx="8" fill="url(#stepGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="28" cy="28" r="14" fill="#4f46e5" />
    <text x="24" y="33" fill="#fff" font-size="13" font-weight="700">2</text>
    <text x="50" y="32" fill="#818cf8" font-size="14" font-weight="700">Safe Scan</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="11" font-weight="600">Read-Only Audit</text>
    <text x="14" y="78" fill="#64748b" font-size="10">FCM socket &amp; Doze</text>
    <text x="14" y="94" fill="#22c55e" font-size="10">● Zero changes made</text>
  </g>

  <!-- Step 3: Review & Gate -->
  <g transform="translate(375, 75)">
    <rect width="150" height="110" rx="8" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)">
      <animate attributeName="stroke" values="#f59e0b;#fbbf24;#f59e0b" dur="2s" repeatCount="indefinite" />
    </rect>
    <circle cx="28" cy="28" r="14" fill="#d97706" />
    <text x="24" y="33" fill="#fff" font-size="13" font-weight="700">3</text>
    <text x="50" y="32" fill="#fbbf24" font-size="14" font-weight="700">User Review</text>
    <text x="14" y="62" fill="#fbbf24" font-size="11" font-weight="700">Mandatory Gate</text>
    <text x="14" y="78" fill="#cbd5e1" font-size="10">Editable 3 Lists:</text>
    <text x="14" y="94" fill="#94a3b8" font-size="10">A:Debloat B:Sleep C:Lock</text>
  </g>

  <!-- Step 4: Apply -->
  <g transform="translate(560, 75)">
    <rect width="135" height="110" rx="8" fill="url(#stepGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="28" cy="28" r="14" fill="#059669" />
    <text x="24" y="33" fill="#fff" font-size="13" font-weight="700">4</text>
    <text x="50" y="32" fill="#34d399" font-size="14" font-weight="700">Safe Apply</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="11" font-weight="600">Auto Backup First</text>
    <text x="14" y="78" fill="#64748b" font-size="10">Reversible AppOps</text>
    <text x="14" y="94" fill="#22c55e" font-size="10">● User-profile only</text>
  </g>

  <!-- Step 5: Verify -->
  <g transform="translate(730, 75)">
    <rect width="135" height="110" rx="8" fill="url(#stepGrad)" stroke="#22c55e" stroke-width="1.5" filter="url(#cardShadow)" />
    <circle cx="28" cy="28" r="14" fill="#16a34a" />
    <text x="24" y="33" fill="#fff" font-size="13" font-weight="700">5</text>
    <text x="50" y="32" fill="#4ade80" font-size="14" font-weight="700">Verify</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="11" font-weight="600">FCM Proof</text>
    <text x="14" y="78" fill="#64748b" font-size="10">mtalk socket:5228</text>
    <text x="14" y="94" fill="#22c55e" font-size="10">● Rollback script saved</text>
  </g>
</svg>
